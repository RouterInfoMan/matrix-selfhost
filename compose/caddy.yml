# MODE=public and MODE=local: Caddy terminates TLS and routes by hostname.
# public: real Let's Encrypt certificates (needs ports 80+443 reachable).
# local:  plain HTTP for *.localhost, otherwise certificates from Caddy's own CA.
# The Caddyfile is generated by matrix.sh into data/Caddyfile.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    volumes:
      - ./data/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data         # certificates (and the local CA) live here
      - ./data/caddy/config:/config
    depends_on:
      - synapse
      - element
      - wellknown
