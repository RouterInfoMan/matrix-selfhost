# MODE=cloudflare: an outbound-only Cloudflare Tunnel. No ports are opened.
# Routes (hostname -> service) are configured in the Cloudflare dashboard.
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - synapse
      - element
      - wellknown
