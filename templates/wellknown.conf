# Serves Matrix delegation on the bare SERVER_NAME domain, so user IDs can be
# @you:__SERVER_NAME__ while Synapse itself lives on __MATRIX_HOST__.
# Only __SERVER_NAME__/.well-known/matrix/* should be routed here.
server {
    listen 80;

    add_header Access-Control-Allow-Origin * always;
    default_type application/json;

    location = /.well-known/matrix/server {
        return 200 '{"m.server": "__MATRIX_HOST__:__FEDERATION_PORT__"}';
    }

    location = /.well-known/matrix/client {
        return 200 '{"m.homeserver": {"base_url": "__MATRIX_URL__"}}';
    }

    location / {
        return 404;
    }
}
